name: Build Relaunch

on:
  push:
    branches-ignore:
      - translation
    paths-ignore:
      - README.md

  pull_request:
    branches:
      - "*"
    paths-ignore:
      - README.md

  release:
    types:
      - published

  workflow_dispatch:

concurrency:
  group: ci-${{ startsWith(github.ref, 'refs/pull/') && github.ref || 'publish' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104
    name: Build with Docker using devkitARM

    outputs:
      commit_tag: ${{ steps.build.outputs.commit_tag }}
      commit_hash: ${{ steps.build.outputs.commit_hash }}
      author_name: ${{ steps.build.outputs.author_name }}
      committer_name: ${{ steps.build.outputs.committer_name }}
      commit_subject: ${{ steps.build.outputs.commit_subject }}
      commit_message: ${{ steps.build.outputs.commit_message }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup environment
        run: |
          git config --global safe.directory '*'

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y p7zip-full curl jq

      - name: Build
        id: build
        shell: bash
        run: |
          set -e

          make

          7z a ImpactCFW.7z ImpactCFW

          mkdir -p "$HOME/artifacts"
          cp ImpactCFW.7z "$HOME/artifacts/"

          # Git information
          echo "commit_tag=$(git describe --abbrev=0 --tags --exclude=git 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"
          echo "commit_hash=$(git log --format=%h -1)" >> "$GITHUB_OUTPUT"

          # Webhook information
          {
            echo "author_name=$(git log -1 "$GITHUB_SHA" --pretty=%aN)"
            echo "committer_name=$(git log -1 "$GITHUB_SHA" --pretty=%cN)"
            echo "commit_subject=$(git log -1 "$GITHUB_SHA" --pretty=%s)"
          } >> "$GITHUB_OUTPUT"

          echo "commit_message<<EOF" >> "$GITHUB_OUTPUT"
          git log -1 "$GITHUB_SHA" --pretty=%b >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Publish build to GH Actions
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: ~/artifacts/*
          if-no-files-found: error


  # Only run this for non-PR jobs.
  publish_build:
    runs-on: ubuntu-latest
    name: Publish build
    needs: build

    if: ${{ !startsWith(github.ref, 'refs/pull/') }}

    env:
      COMMIT_TAG: ${{ needs.build.outputs.commit_tag }}
      COMMIT_HASH: ${{ needs.build.outputs.commit_hash }}
      AUTHOR_NAME: ${{ needs.build.outputs.author_name }}
      COMMIT_SUBJECT: ${{ needs.build.outputs.commit_subject }}
      COMMIT_MESSAGE: ${{ needs.build.outputs.commit_message }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build

      - name: Delete the 'git' release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          RELEASE_ID=$(gh api \
            "/repos/${GITHUB_REPOSITORY}/releases/tags/git" \
            --jq '.id' 2>/dev/null || true)

          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
            echo "Deleting existing git release: $RELEASE_ID"

            gh api \
              --method DELETE \
              "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
          else
            echo "No existing git release found."
          fi

      - name: Upload to release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          RELEASE_ID=$(gh api \
            "/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            --jq '.id')

          for file in "${GITHUB_WORKSPACE}"/build/*; do
            echo "Uploading $(basename "$file")"

            gh release upload \
              "${GITHUB_REF_NAME}" \
              "$file" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          done

      - name: Create 'git' release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          BODY="${AUTHOR_NAME} - ${COMMIT_SUBJECT}

          ${COMMIT_MESSAGE}"

          gh release create git \
            --repo "$GITHUB_REPOSITORY" \
            --title "Continuous Build - ${COMMIT_HASH}" \
            --notes "$BODY" \
            --prerelease \
            --target "$GITHUB_SHA"

          for file in "${GITHUB_WORKSPACE}"/build/*; do
            echo "Uploading $(basename "$file")"

            gh release upload \
              git \
              "$file" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          done


  send_success_webhook:
    runs-on: ubuntu-latest
    name: Send success webhook
    needs:
      - build
      - publish_build

    if: ${{ !startsWith(github.ref, 'refs/pull/') && success() }}

    env:
      COMMIT_HASH: ${{ needs.build.outputs.commit_hash }}
      AUTHOR_NAME: ${{ needs.build.outputs.author_name }}
      COMMITTER_NAME: ${{ needs.build.outputs.committer_name }}
      COMMIT_SUBJECT: ${{ needs.build.outputs.commit_subject }}
      COMMIT_MESSAGE: ${{ needs.build.outputs.commit_message }}

    steps:
      - name: Send success webhook
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          set -e

          if [ -z "$WEBHOOK_URL" ]; then
            echo "WEBHOOK_URL secret is not configured."
            exit 1
          fi

          jq -n \
            --arg hash "$COMMIT_HASH" \
            --arg author "$AUTHOR_NAME" \
            --arg committer "$COMMITTER_NAME" \
            --arg subject "$COMMIT_SUBJECT" \
            --arg message "$COMMIT_MESSAGE" \
            '{
              commit_hash: $hash,
              author_name: $author,
              committer_name: $committer,
              commit_subject: $subject,
              commit_message: $message
            }' |
          curl \
            --fail \
            --silent \
            --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            --data-binary @- \
            "$WEBHOOK_URL"
