<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1228" height="198" viewBox="0 0 1228 198" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0%" stop-color="#fff176" />
      <stop offset="50%" stop-color="#ffd54f" />
      <stop offset="100%" stop-color="#ffc107" />
    </linearGradient>
    <mask id="softEdge">
      <rect x="0" y="0" width="1228" height="198" fill="white" />
      <!-- soft transparent edges -->
      <rect x="0" y="0" width="1228" height="198" fill="black" opacity="0" />
    </mask>
  </defs>

  <!-- background: embed original PNG from the repo at the known commit -->
  <image href="https://raw.githubusercontent.com/SlabyLol/ImpactCFW/2057d38eb75f2fe9644b37aaf2f493b481b4b531/logo.png" x="0" y="0" width="1228" height="198" preserveAspectRatio="xMidYMid slice" />

  <!-- golden radial light behind the handheld -->
  <radialGradient id="halo" cx="50%" cy="55%" r="40%">
    <stop offset="0%" stop-color="#fff9c4" stop-opacity="0.95" />
    <stop offset="35%" stop-color="#ffe082" stop-opacity="0.65" />
    <stop offset="100%" stop-color="#000000" stop-opacity="0" />
  </radialGradient>
  <rect x="0" y="0" width="1228" height="198" fill="url(#halo)" opacity="0.25" />

  <!-- horizontal gold line behind the text -->
  <rect x="40" y="28" width="1148" height="6" fill="url(#gold)" opacity="0.95" rx="3" />

  <!-- Pixel-style text: ImpactCFW -->
  <!-- We approximate a pixel aesthetic using a chunky monospace font and heavy stroke -->
  <g filter="url(#glow)">
    <text x="50%" y="66" font-family="'Courier New', Courier, monospace" font-weight="700" font-size="64" text-anchor="middle" fill="#ffd54f" stroke="#1b1208" stroke-width="8" paint-order="stroke">
      ImpactCFW
    </text>
    <!-- pixel-style block shadow rectangle behind text to mimic bordered pixel text -->
    <rect x="172" y="20" width="884" height="68" fill="rgba(0,0,0,0.0)" stroke="#2b1f14" stroke-width="0" rx="0" />
  </g>

  <!-- small thin highlight line across the top of the letters -->
  <text x="50%" y="62" font-family="'Courier New', Courier, monospace" font-weight="700" font-size="64" text-anchor="middle" fill="#fff9c4" opacity="0.65">ImpactCFW</text>

  <!-- optional lower glow where stylus meets screen suggestion -->
  <ellipse cx="614" cy="120" rx="160" ry="32" fill="#ffd54f" opacity="0.08" />

  <!-- make edges slightly faded like original banner -->
  <rect x="0" y="0" width="1228" height="198" fill="none" mask="url(#softEdge)" />

  <!-- metadata comment: generated SVG replaces the textual branding with ImpactCFW -->
</svg>
